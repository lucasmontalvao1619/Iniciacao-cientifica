[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planejador-experimentos"
version = "0.1.0"
description = "Backend e banco de dados do aplicativo de planejamento automatizado de experimentos laboratoriais."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "SQLAlchemy>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
]

[project.optional-dependencies]
# Motores de banco alternativos (opcionais). SQLite já vem com o Python.
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
# Camada de API opcional (para ligar um frontend web/externo).
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
    # Stubs de tipo do pandas (usado em planejador.core.tabelas).
    "pandas-stubs>=2.1",
    # httpx é exigido pelo TestClient do FastAPI (tests/test_api.py).
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["planejador"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
# Difere de propósito do target-version do ruff (py311). O ruff mira a versão
# mais baixa suportada, para acusar sintaxe que quebraria no 3.11. O mypy
# precisa acompanhar o interpretador que o executa: os stubs do numpy >= 2.5
# usam a instrução `type`, de 3.12, e não são parseáveis sob python_version
# 3.11 — o check aborta antes de chegar ao nosso código.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# A checagem de tipos cobre `backend` (o código que roda em produção), não os
# testes — ver o alvo `type-check` do Makefile. Por isso não há override para
# `tests.*`: ele seria configuração morta, e `warn_unused_configs` a acusaria.

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# FastAPI e Pydantic vivem no extra opcional 'api'. Quem só mexe no core não
# precisa instalá-los, e `make type-check` não deve quebrar por isso — quando o
# extra está instalado, o mypy usa os tipos reais normalmente.
[[tool.mypy.overrides]]
module = ["fastapi.*", "pydantic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# Torna os testes independentes do install editável. Em macOS, o Finder/serviços
# do sistema podem marcar os arquivos .pth de site-packages com a flag
# UF_HIDDEN, e o `site` do Python >= 3.11 ignora .pth ocultos — o pacote some do
# sys.path e todo import de `planejador` falha. Apontar o pytest direto para
# `backend/` elimina essa dependência.
pythonpath = ["backend"]
