name: Aplicativos Mac e Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
          - os: macos-15
            platform: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: ${{ matrix.platform == 'windows' && 'windows' || 'offscreen' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependências
        run: python -m pip install -e ".[ui,bundle,api,dev]"
      - name: Testar
        run: python -m pytest --junitxml=test-results.xml
      - name: Lint
        run: python -m ruff check
      - name: Compilar Windows
        if: matrix.platform == 'windows'
        run: python -m PyInstaller --noconfirm --distpath dist/windows packaging/PlanejadorWindows.spec
      - name: Compilar Mac
        if: matrix.platform == 'mac'
        run: python -m PyInstaller --noconfirm --distpath /private/tmp/planejador-build packaging/Planejador.spec
      - name: Montar distribuição
        run: python packaging/build_release.py --platform ${{ matrix.platform }}
      - name: Verificar executável Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/release/Planejador de Experimentos/Planejador de Experimentos.exe'
          $report = Join-Path $PWD 'windows-smoke.json'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test', $report -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Executável falhou: $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw (Get-Content $report -Raw) }
      - name: Verificar executável Mac
        if: matrix.platform == 'mac'
        run: '"dist/release/Planejador de Experimentos/Planejador de Experimentos.app/Contents/MacOS/Planejador de Experimentos" --smoke-test "$PWD/mac-smoke.json"'
      - name: Gerar instalador Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Compilador Inno Setup não encontrado" }
          & $iscc packaging/Planejador.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falha no instalador' }
      - name: Testar instalação e preservação dos registros
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'Planejador Instalado'
          $installer = Join-Path $PWD 'dist/installer/Planejador-Windows-Setup.exe'
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$destination`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Instalação falhou' }
          $report = Join-Path $PWD 'installed-smoke.json'
          $process = Start-Process -FilePath (Join-Path $destination 'Planejador de Experimentos.exe') -ArgumentList '--smoke-test', $report -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Get-Content $report -Raw | ConvertFrom-Json).ok) { throw 'Aplicativo instalado falhou' }
          $record = Join-Path $destination 'Registros de Experimentos\teste-preservar.json'
          Set-Content $record '{"teste":true}'
          $process = Start-Process -FilePath (Join-Path $destination 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $record)) { throw 'Registro não foi preservado' }
      - uses: actions/upload-artifact@v7
        with:
          name: Planejador-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/installer/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verificacoes-${{ matrix.platform }}
          path: |
            test-results.xml
            *-smoke.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Planejador-*
          path: release
          merge-multiple: true
      - name: Publicar downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Planejador $TAG" --generate-notes
          mapfile -d '' files < <(find release -type f \( -name '*.zip' -o -name '*.exe' \) -print0)
          test "${#files[@]}" -eq 3
          gh release upload "$TAG" "${files[@]}" --clobber
